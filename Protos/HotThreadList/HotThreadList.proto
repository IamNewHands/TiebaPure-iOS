syntax = "proto3";

package tieba.hotThreadList;

import "CommonRequest.proto";
import "Error.proto";
import "ThreadInfo.proto";

// Project-maintained projection of the hot-thread (热榜) endpoint. Field numbers
// are wire identifiers and must only change with a matching fixture update.
// Only the fields TiebaPure reads are declared; the topic list and inner tabs
// the endpoint also returns are skipped by Protobuf as unknown fields.

message FrsTabInfo {
  string tab_name = 3;
  string tab_code = 8;
}

// Request semantics, verified against the official client and the two public
// reimplementations: tab_id is always "1", and tab_code = "all" is the
// whole-list tab. An empty tab_code is NOT the default — the service answers it
// with a stub of a handful of threads — so callers must send "all" (see
// HotTab.allCode). The tab list the service reports carries only its category
// sub-tabs, never "all", so the 全部 entry is supplied by the client.
message HotThreadListRequestData {
  tieba.CommonRequest common = 1;
  string tab_id = 2;
  string tab_code = 3;
}

message HotThreadListRequest {
  HotThreadListRequestData data = 1;
}

message HotThreadListResponseData {
  repeated tieba.ThreadInfo thread_info = 2;
  repeated FrsTabInfo hot_thread_tab_info = 3;
}

message HotThreadListResponse {
  tieba.Error error = 1;
  HotThreadListResponseData data = 2;
}