name: iOS CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DERIVED_DATA: /tmp/TiebaPureDerivedData

jobs:
  # Fast compile-only feedback. The test lanes below cannot report a syntax
  # error until after they boot a simulator (~3 min) and build the whole app,
  # so a plain type error costs 7+ minutes before it is visible. This lane
  # skips the simulator and the test run entirely: `build-for-testing` compiles
  # the app plus both test bundles against a generic destination and stops
  # there, so compile errors surface in roughly half the time. It runs in
  # parallel with the test lanes rather than gating them, so the wall-clock cost
  # of a green run is zero.
  build-only:
    name: Compile check
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: tieba-deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'TiebaPure.xcodeproj/**', 'TiebaPure/**', 'TiebaPureTests/**', 'TiebaPureUITests/**') }}
          restore-keys: |
            tieba-deriveddata-${{ runner.os }}-

      - name: Compile app and test bundles
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -parallelizeTargets \
            build-for-testing

      - name: Report compiled products
        run: |
          products="$DERIVED_DATA/Build/Products/Debug-iphonesimulator"
          test -d "$products/TiebaPure.app"
          test -d "$products/TiebaPureTests.xctest"
          ls -1 "$products" | head -20

  # Unit tests run independently from UI / release work so each lane can run
  # on its own runner in parallel. DerivedData is cached across runs (and
  # reused between lanes via a prefix restore key) so unchanged modules are
  # not recompiled from scratch on every run.
  unit-tests:
    name: Unit tests + iOS 16 linkage
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot iPhone simulator
        run: |
          source scripts/ci-simulator.sh
          if [ -z "$(ci_runtime_id)" ]; then
            echo "::error::The macos-26 image does not contain the pinned iOS runtime."
            exit 1
          fi
          udid="$(ci_create_simulator "$(ci_iphone_device_type)" 'TiebaPure CI')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: tieba-deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'TiebaPure.xcodeproj/**', 'TiebaPure/**', 'TiebaPureTests/**', 'TiebaPureUITests/**', 'TiebaPureOpenIn/**') }}
          restore-keys: |
            tieba-deriveddata-${{ runner.os }}-

      - name: Unit tests
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled YES \
            -quiet \
            test -only-testing:TiebaPureTests \
            -skip-testing:TiebaPureTests/AnonymousLiveSmokeTests \
            -retry-tests-on-failure

      - name: Verify iOS 16 compatibility linkage
        run: |
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/TiebaPure.app"
          APP_BINARY="$APP/TiebaPure.debug.dylib"
          if [ ! -f "$APP_BINARY" ]; then
            APP_BINARY="$APP/TiebaPure"
          fi
          TEST_BINARY="$APP/PlugIns/TiebaPureTests.xctest/TiebaPureTests"
          for binary in "$APP_BINARY" "$TEST_BINARY"; do
            test -f "$binary"
            load_commands="$(otool -l "$binary" | awk '/cmd LC_LOAD/{command=$2} /SwiftData.framework/{print command}' | sort -u)"
            test "$load_commands" = LC_LOAD_WEAK_DYLIB
          done

  ui-tests-iphone:
    name: UI smoke tests (iPhone)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot iPhone simulator
        run: |
          source scripts/ci-simulator.sh
          udid="$(ci_create_simulator "$(ci_iphone_device_type)" 'TiebaPure CI UI')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: tieba-deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'TiebaPure.xcodeproj/**', 'TiebaPure/**', 'TiebaPureTests/**', 'TiebaPureUITests/**', 'TiebaPureOpenIn/**') }}
          restore-keys: |
            tieba-deriveddata-${{ runner.os }}-

      - name: Fixture UI smoke tests
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -quiet \
            test \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testLaunchShowsHomeWithoutLoginAndRootTabs \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectWithNormalAnimations \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectFromDetailOnlyReturnsToFeed \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectFromSearchOnlyReturnsToFeed \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectDuringInFlightRefreshReturnsToTop \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testSearchResultRoutesToMatchedReply \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testForumLatestMenuSwitchesReplyPublishAndFeaturedCategories \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanToggleProfileFollowState \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testOwnProfileFollowingCountTracksNestedUnfollow \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanUnfollowForumAndOpenFollowerList \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testFullScreenImageOffersDownloadAndTapReturnsToSource \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanAcknowledgeComposeRiskSaveDraftAndPublishThread \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanReplyToFloorAndReturnsToUpdatedSubpostList \
            -retry-tests-on-failure

  ui-tests-ipad:
    name: UI smoke test (iPad)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot iPad simulator
        run: |
          source scripts/ci-simulator.sh
          udid="$(ci_create_simulator "$(ci_ipad_device_type)" 'TiebaPure CI iPad')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: tieba-deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'TiebaPure.xcodeproj/**', 'TiebaPure/**', 'TiebaPureTests/**', 'TiebaPureUITests/**', 'TiebaPureOpenIn/**') }}
          restore-keys: |
            tieba-deriveddata-${{ runner.os }}-

      - name: iPad split layout smoke test
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -quiet \
            test \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testIPadLandscapeReaderListUsesAvailableWidth \
            -retry-tests-on-failure

  # Release build and the unsigned IPA only run on events that actually
  # produce an artifact (tag / release / manual dispatch). Plain pushes to
  # main just run the test lanes above, which keeps the common path fast.
  release-artifact:
    name: Release build + unsigned IPA
    if: github.ref_type == 'tag' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [unit-tests, ui-tests-iphone, ui-tests-ipad]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: tieba-deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'TiebaPure.xcodeproj/**', 'TiebaPure/**', 'TiebaPureTests/**', 'TiebaPureUITests/**', 'TiebaPureOpenIn/**') }}
          restore-keys: |
            tieba-deriveddata-${{ runner.os }}-

      - name: Release build
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -quiet \
            build CODE_SIGNING_ALLOWED=NO

      - name: Verify build objects (MinOS, linkage, notices)
        run: |
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/TiebaPure.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = 16.4
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/PlugIns/TiebaPureOpenIn.appex/Info.plist")" = 16.4
          load_commands="$(otool -l "$APP/TiebaPure" | awk '/cmd LC_LOAD/{command=$2} /SwiftData.framework/{print command}' | sort -u)"
          test "$load_commands" = LC_LOAD_WEAK_DYLIB
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/LICENSE"
          grep -Fq 'GNU GENERAL PUBLIC LICENSE' "$APP/LICENSE"
          test -f "$APP/SwiftProtobuf-Apache-2.0.txt"
          grep -Fq 'Apache License' "$APP/SwiftProtobuf-Apache-2.0.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$APP/Info.plist")" = true

      - name: Install xcodegen if absent
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Package unsigned IPA
        id: package-ipa
        run: |
          ./scripts/package-unsigned-ipa.sh
          IPA="$GITHUB_WORKSPACE/build/TiebaPure-unsigned.ipa"
          test -f "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Publish unsigned IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="nightly"
          fi
          IPA="${IPA_PATH}"
          test -f "$IPA"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TITLE="TiebaPure IPA ${RELEASE_TAG} (run #${GITHUB_RUN_NUMBER})"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOTES=$(printf 'Unofficial unsigned build of `%s`.\n\n- Built at: %s\n- Run: [run #%s](%s)\n- Commit: `%s`\n\n> Asset is unsigned; sign it before installing on a real device.\n' "$RELEASE_TAG" "$TIMESTAMP" "$GITHUB_RUN_NUMBER" "$RUN_URL" "$SHORT_SHA")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$IPA" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES"
          fi

  # Keep one stable check name (branch protection compatibility) that depends on
  # every always-on lane.
  ci-ok:
    name: ci-ok
    needs: [build-only, unit-tests, ui-tests-iphone, ui-tests-ipad]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."