name: Sync upstream

on:
  schedule:
    # Mirror upstream every 6 hours. Adjust the cron to change the cadence.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  # The source repo whose code and releases this repo mirrors.
  UPSTREAM: infinityf4p/TiebaPure-iOS

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: main

      - name: Record current HEAD
        run: |
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main:refs/remotes/upstream/main

      - name: Merge upstream main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          # Explicitly prefer our local version of any conflicting file (e.g. ci.yml)
          # so this repo's workflow customizations survive upstream syncs.
          git merge --no-edit --strategy-option=ours upstream/main
          if [[ "$(git rev-parse HEAD)" == "$HEAD_BEFORE" ]]; then
            echo "main already up to date with upstream"
          else
            git push origin main
            echo "Synced upstream main into main"
          fi

      - name: Mirror new upstream release tag
        run: |
          TAG="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          echo "Latest upstream release tag: $TAG"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists here; nothing to do"
            exit 0
          fi
          # Tag OUR synced HEAD (which carries our ci.yml packaging steps) rather than
          # the raw upstream object, so the iOS CI `push: tags: ['v*']` trigger runs our
          # workflow and produces the unsigned IPA from the synced source.
          git tag "${TAG}" HEAD
          git push origin "${TAG}"
          echo "Mirrored upstream release tag ${TAG}"